# Ver calendario/nginx.conf: sin Cache-Control explicito el navegador
# puede servir index.html desde cache heuristica sin ir a red, lo que tras
# un logout se veia como quedarse en una version ya autenticada de la pagina
# en vez de ser redirigido a Keycloak. sw.js tambien va sin cache para que
# el navegador siempre recoja el service worker mas reciente. manifest.json
# e iconos si pueden cachearse con normalidad (nginx por defecto). Los
# bundles JS/CSS de Angular llevan hash en el nombre (p.ej. main-XXXX.js):
# esos si pueden cachearse largo (son inmutables, un cambio de contenido
# siempre genera un nombre nuevo), a diferencia de index.html/sw.js.
server {
    listen 80;
    server_name localhost;

    # La cookie de sesion de oauth2-proxy (compartida por todo el hub) crece
    # con el tiempo -- se trocea en varias cookies de ~4kb al superarlo, y la
    # suma de todas mas las propias de Keycloak puede superar el buffer de
    # cabeceras por defecto de nginx (8k), devolviendo 400 "Request Header Or
    # Cookie Too Large". Visto en produccion con la cookie ya crecida.
    large_client_header_buffers 4 32k;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
