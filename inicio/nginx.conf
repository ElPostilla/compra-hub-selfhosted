# Ver calendario/nginx.conf (version vanilla, mismo motivo): sin
# Cache-Control explicito el navegador puede servir index.html desde cache
# heuristica sin ir a red.
server {
    listen 80;
    server_name localhost;

    # La cookie de sesion de oauth2-proxy (compartida por todo el hub) crece
    # con el tiempo -- se trocea en varias cookies de ~4kb al superarlo, y la
    # suma de todas mas las propias de Keycloak puede superar el buffer de
    # cabeceras por defecto de nginx (8k), devolviendo 400 "Request Header Or
    # Cookie Too Large". Visto en produccion con la cookie ya crecida.
    large_client_header_buffers 4 32k;

    # /legal/ y /fonts/ se publican SIN login (Ingress lista-compra-legal).
    # Traefik enruta por la ruta tal cual llega y nginx luego la decodifica y
    # normaliza: «/legal/..%2Findex.html» entraria por el Ingress publico y
    # acabaria sirviendo /index.html sin pasar por el login. Ninguna URL
    # legitima del hub lleva en la ruta barras o puntos codificados ni «..»:
    # se rechazan (solo en la ruta; la query no se mira).
    if ($request_uri ~* "^[^?]*(%2f|%2e|%5c|\.\.)") {
        return 400;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
