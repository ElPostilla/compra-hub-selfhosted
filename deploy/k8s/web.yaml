# Las 8 apps web (Angular compilado, servido con nginx).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inicio
  labels:
    app: inicio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inicio
  template:
    metadata:
      labels:
        app: inicio
    spec:
      containers:
        - name: inicio
          image: compra-hub/inicio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inicio
spec:
  selector:
    app: inicio
  ports:
    - name: http
      port: 80
      targetPort: http
