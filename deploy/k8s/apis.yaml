# Las 7 APIs del hub (Node + Express). Todas leen la configuracion comun
# del ConfigMap hub-config (OIDC_ISSUER, OLLAMA_URL...) y su contraseña de
# Postgres del Secret hub-secrets (ver ../kustomization.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lista-compra-api
  labels:
    app: lista-compra-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lista-compra-api
  template:
    metadata:
      labels:
        app: lista-compra-api
    spec:
      containers:
        - name: lista-compra-api
          image: compra-hub/lista-compra-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hub-config
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: lista_compra
            - name: PGUSER
              value: lista_compra
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: LISTA_COMPRA_DB_PASSWORD
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: VAPID_PRIVATE_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lista-compra-api
spec:
  selector:
    app: lista-compra-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendario-api
  labels:
    app: calendario-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendario-api
  template:
    metadata:
      labels:
        app: calendario-api
    spec:
      containers:
        - name: calendario-api
          image: compra-hub/calendario-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hub-config
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: calendario
            - name: PGUSER
              value: calendario
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: CALENDARIO_DB_PASSWORD
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
