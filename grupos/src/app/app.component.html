<div class="page">
  <header>
    <div class="top-links">
      <div class="top-links-left">
        <a class="app-home-link" href="/" aria-label="Inicio"><app-icon name="home"></app-icon></a>
        <button type="button" class="app-nav-toggle" aria-label="Otras apps" (click)="navDrawer.open()"><app-icon name="menu"></app-icon></button>
      </div>
      <app-profile-menu></app-profile-menu>
    </div>
    <h1>Social</h1>
    <p>Amigos y grupos con los que compartes listas, tareas y gastos.</p>
  </header>

  <main>
    <div class="status" [class.visible]="status.visible()" [class.error]="status.kind() === 'error'" [class.ok]="status.kind() === 'ok'">
      {{ status.message() }}
    </div>

    <app-invite-card (joined)="groupsCard.onJoined($event)"></app-invite-card>
    <app-friends-card></app-friends-card>
    <app-groups-card #groupsCard [meId]="meId()"></app-groups-card>
  </main>
</div>

<app-nav-drawer #navDrawer></app-nav-drawer>
<app-asistente app="social" [view]="assistantView()" (changed)="onAssistantChanged()"></app-asistente>
