# Hub de casa con Docker Compose: Traefik (HTTPS + rutas), Keycloak (cuentas),
# oauth2-proxy (sesion), Postgres, las 7 APIs y las 8 apps web.
#
#   cp .env.example .env   # y rellena los valores (ver README)
#   sh scripts/build-images.sh
#   docker compose up -d
#
# Asistente con un Ollama en este mismo equipo:  docker compose --profile ollama up -d
name: compra-hub

x-api: &api
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-auth-env: &auth-env
  # Issuer publico del realm (lo que va en el "iss" de los tokens) y JWKS
  # interno: las APIs descargan las claves de Keycloak sin salir de Docker.
  OIDC_ISSUER: https://${HUB_DOMAIN}/auth/realms/compras
  OIDC_JWKS_URI: http://keycloak:8080/auth/realms/compras/protocol/openid-connect/certs
  TZ: ${TZ:-Europe/Madrid}

x-web: &web
  restart: unless-stopped

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?Define HUB_DOMAIN en .env}
      # "letsencrypt" pide un certificado real (el dominio tiene que
      # apuntar a esta maquina y el puerto 80 ser accesible desde internet).
      # Vacio: certificado autofirmado de Traefik (pruebas en local).
      TLS_CERT_RESOLVER: ${TLS_CERT_RESOLVER-letsencrypt}
      # "true" publica https://<dominio>/mcp para clientes MCP externos.
      HUB_MCP_PUBLIC: ${HUB_MCP_PUBLIC:-false}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      default:
        # oauth2-proxy llama a Keycloak por la URL publica del issuer: con
        # este alias, dentro de Docker el dominio resuelve a Traefik y no
        # hace falta salir a internet (ni que el router haga NAT loopback).
        aliases:
          - ${HUB_DOMAIN}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      LISTA_COMPRA_DB_PASSWORD: ${LISTA_COMPRA_DB_PASSWORD:?}
      CALENDARIO_DB_PASSWORD: ${CALENDARIO_DB_PASSWORD:?}
      TODO_DB_PASSWORD: ${TODO_DB_PASSWORD:?}
      GASTOS_DB_PASSWORD: ${GASTOS_DB_PASSWORD:?}
      MENU_DB_PASSWORD: ${MENU_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    command: start --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${HUB_DOMAIN}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      # Se sustituyen dentro de realm-compras.json al importarlo (solo la
      # primera vez: si el realm ya existe, no se vuelve a importar).
      HUB_DOMAIN: ${HUB_DOMAIN}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?}
    volumes:
      - ./deploy/keycloak/realm-compras.json:/opt/keycloak/data/import/realm-compras.json:ro
    healthcheck:
      # La imagen no trae curl: peticion HTTP a mano al puerto de gestion.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      traefik:
        condition: service_started
    command:
      - --provider=keycloak-oidc
      - --client-id=compras
      - --oidc-issuer-url=https://${HUB_DOMAIN}/auth/realms/compras
      - --redirect-url=https://${HUB_DOMAIN}/oauth2/callback
      - --insecure-oidc-allow-unverified-email=true
      - --upstream=static://202
      - --reverse-proxy=true
      - --http-address=0.0.0.0:4180
      - --email-domain=*
      - --cookie-expire=24h
      - --cookie-refresh=2m
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-domain=${HUB_DOMAIN}
      - --cookie-name=_oauth2_proxy_compras
      - --skip-provider-button=true
      - --cookie-csrf-per-request=true
      - --cookie-csrf-per-request-limit=10
      - --silence-ping-logging=true
      # Llama a Keycloak a traves de Traefik dentro de Docker: con un
      # certificado autofirmado (pruebas en local) la verificacion fallaria.
      - --ssl-insecure-skip-verify=true
      - --oidc-extra-audience=account
      - --whitelist-domain=${HUB_DOMAIN}
      - --trusted-proxy-ip=0.0.0.0/0
      - --code-challenge-method=S256
      - --pass-authorization-header=true
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --skip-jwt-bearer-tokens=true
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?}

  # --- APIs -----------------------------------------------------------------
  lista-compra-api:
    <<: *api
    image: ${REGISTRY:-compra-hub}/lista-compra-api:${TAG:-latest}
    environment:
      <<: *auth-env
      PGHOST: postgres
      PGDATABASE: lista_compra
      PGUSER: lista_compra
      PGPASSWORD: ${LISTA_COMPRA_DB_PASSWORD}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      MERCADONA_WAREHOUSE: ${MERCADONA_WAREHOUSE:-4045}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}

  calendario-api:
    <<: *api
    image: ${REGISTRY:-compra-hub}/calendario-api:${TAG:-latest}
    environment:
      <<: *auth-env
      PGHOST: postgres
      PGDATABASE: calendario
      PGUSER: calendario
      PGPASSWORD: ${CALENDARIO_DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${HUB_DOMAIN}/api-calendario/auth/callback

  todo-api:
    <<: *api
    image: ${REGISTRY:-compra-hub}/todo-api:${TAG:-latest}
    environment:
      <<: *auth-env
      PGHOST: postgres
      PGDATABASE: todo
      PGUSER: todo
      PGPASSWORD: ${TODO_DB_PASSWORD}

  gastos-api:
    <<: *api
    image: ${REGISTRY:-compra-hub}/gastos-api:${TAG:-latest}
    environment:
      <<: *auth-env
      PGHOST: postgres
      PGDATABASE: gastos
      PGUSER: gastos
      PGPASSWORD: ${GASTOS_DB_PASSWORD}

  menu-api:
    <<: *api
    image: ${REGISTRY:-compra-hub}/menu-api:${TAG:-latest}
    environment:
      <<: *auth-env
      PGHOST: postgres
      PGDATABASE: menu
      PGUSER: menu
      PGPASSWORD: ${MENU_DB_PASSWORD}

  # Servidor MCP: las apps del hub como herramientas para un modelo. No se
  # publica en Traefik; lo usan el asistente y, si quieres, otros clientes
  # MCP de esta misma red (ver README, «Asistente y MCP»).
  hub-mcp:
    image: ${REGISTRY:-compra-hub}/hub-mcp:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *auth-env

  asistente-api:
    image: ${REGISTRY:-compra-hub}/asistente-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *auth-env
      HUB_MCP_URL: http://hub-mcp:3000/mcp
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    volumes:
      # Prompt del asistente: editable sin recompilar (se lee en cada mensaje).
      - ./asistente-api/config:/app/config:ro

  # --- Apps web (Angular servido con nginx) -----------------------------------
  inicio:
    <<: *web
    image: ${REGISTRY:-compra-hub}/inicio:${TAG:-latest}
    volumes:
      # Paginas legales: editables sin recompilar.
      - ./inicio/public/legal:/usr/share/nginx/html/legal:ro
  lista-compra:
    <<: *web
    image: ${REGISTRY:-compra-hub}/lista-compra:${TAG:-latest}
  calendario:
    <<: *web
    image: ${REGISTRY:-compra-hub}/calendario:${TAG:-latest}
  todo:
    <<: *web
    image: ${REGISTRY:-compra-hub}/todo:${TAG:-latest}
  gastos:
    <<: *web
    image: ${REGISTRY:-compra-hub}/gastos:${TAG:-latest}
  menu:
    <<: *web
    image: ${REGISTRY:-compra-hub}/menu:${TAG:-latest}
  perfil:
    <<: *web
    image: ${REGISTRY:-compra-hub}/perfil:${TAG:-latest}
  grupos:
    <<: *web
    image: ${REGISTRY:-compra-hub}/grupos:${TAG:-latest}

  # --- Opcional: Ollama en este mismo equipo ----------------------------------
  # docker compose --profile ollama up -d
  # docker compose exec ollama ollama pull gemma4:e4b
  ollama:
    image: ollama/ollama:0.40.4
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres:
  letsencrypt:
  ollama:
